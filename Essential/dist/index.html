    <script>
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', function(e) {
        if (e.key === "F12" || e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'c')) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && e.key.toLowerCase() === 'u') {
          e.preventDefault();
          return false;
        }
      });
    </script>

  <body>
    <div id="root"></div>
      <!-- Raya scroll postMessage listener -->
    <script>
      window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'raya-scroll') return;
        var d = e.data;
        if (d.direction === 'down') { window.scrollBy({ top: 600, behavior: 'smooth' }); return; }
        if (d.direction === 'up')   { window.scrollBy({ top: -600, behavior: 'smooth' }); return; }
        if (d.section) {
          var el = document.getElementById(d.section) ||
                   document.querySelector('.' + d.section + '-section') ||
                   document.querySelector('[id*="' + d.section + '"]');
          if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        }
      });
    </script>
