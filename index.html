    <div id="root"></div>

    <!-- ═══ 3D VRM Full-Body Canvas & Vanilla Scripts ═══ -->
    <canvas id="vrm-canvas"></canvas>

    <script>
      window.getAvatarUrl = function(localPath) {
        if (!localPath) return '';
        if (localPath.startsWith('http://') || localPath.startsWith('https://')) return localPath;
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '' || window.location.protocol === 'file:') {
          return localPath;
        }
        return `/api/avatar-proxy?file=${encodeURIComponent(localPath)}`;
      };

      function activateAvatarAndChatbot() {
        const canvas = document.getElementById('vrm-canvas');
        if (canvas) {
          canvas.classList.add('active');
          canvas.style.display = 'block';
          canvas.style.opacity = '1';
        }
        const panel = document.getElementById('chatbot-panel');
        if (panel) {
          panel.classList.add('active');
          panel.style.opacity = '1';
          panel.style.pointerEvents = 'auto';
        }
        if (window.setVRMVisibility) window.setVRMVisibility(true);
        if (window.chatBot) window.chatBot._userHasGestured = true;
        if (typeof window.onBubblePopped === 'function') {
          window.onBubblePopped();
        } else {
          if (typeof window.playWaveAnimation === 'function') {
            window.playWaveAnimation();
          }
          if (window.chatBot && typeof window.chatBot.introduceHerself === 'function') {
            window.chatBot.introduceHerself();
          }
        }
      }
    </script>
